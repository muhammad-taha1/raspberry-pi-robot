# Authoritative GPIO pin map for raspberry-pi-robot.
#
# Every physical device's pin lives here, nowhere else.

[pins]
led = 24
button = 5      # push-to-talk, wired to GND; gpiozero's internal pull-up

# L298N motor driver (moved off GPIO 17 to free it for the status LED —
# the original scripts had both on 17).
motor_in1 = 17
motor_in2 = 27
motor_in3 = 22
motor_in4 = 23

[voice]
# Installed manually on the Pi. Keep this model and its matching .onnx.json
# sidecar out of Git (see .gitignore).
model_path = "/home/taha/robot/voices/en_GB-alan-medium.onnx"
# Piper's speaking pace: seconds of speech per unit, so lower is faster. 1.0 is
# the voice's natural pace. Audition values with scripts/voice_test.py.
length_scale = 0.75

[chat]
# Small local GGUF for prose (jokes/greetings/small talk) after Needle's tool
# calls come back empty. Installed manually on the Pi, kept out of Git (see
# .gitignore). Missing file degrades to NullChat with a logged warning
# rather than crashing the daemon — see robotd/models/chat.py.
# scripts/chat_test.py showed Qwen2.5-0.5B correctly grounding the assistant's
# name (LFM2.5 invented "Sir Alistair Blackwood") and staying consistent
# across turns (LFM2.5 told a joke cold, then refused the same request after
# a few turns of history) — trades ~240MB more peak RSS for that.
model_path = "/home/taha/robot/models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"

[stt]
# faster-whisper model name, not a path: weights are fetched from Hugging Face
# and cached on first run, same as Needle. scripts/stt_test.py showed tiny.en
# ~45% faster and half the RSS of base.en, and it caught "Hey Alfred" where
# base.en dropped it — re-check with stt_test.py if it starts mishearing.
model = "tiny.en"
