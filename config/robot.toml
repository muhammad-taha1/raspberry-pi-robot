# Authoritative GPIO pin map for raspberry-pi-robot.
#
# Every physical device's pin lives here, nowhere else.

[pins]
led = 24

# L298N motor driver (moved off GPIO 17 to free it for the status LED —
# the original scripts had both on 17).
motor_in1 = 17
motor_in2 = 27
motor_in3 = 22
motor_in4 = 23

[voice]
# Installed manually on the Pi. Keep this model and its matching .onnx.json
# sidecar out of Git (see .gitignore).
model_path = "/home/taha/robot/voices/en_GB-alan-medium.onnx"

[chat]
# Small local GGUF for prose (jokes/greetings/small talk) after Needle's tool
# calls come back empty. Installed manually on the Pi, kept out of Git (see
# .gitignore). Missing file degrades to NullChat with a logged warning
# rather than crashing the daemon — see robotd/models/chat.py.
model_path = "/home/taha/robot/models/LFM2.5-350M-Q4_K_M.gguf"
