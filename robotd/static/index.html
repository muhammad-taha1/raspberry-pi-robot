<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>robotd</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #111;
    color: #eee;
  }
  h1 { font-size: 1.2rem; font-weight: 600; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 1rem;
    padding: 0.5rem;
    border-radius: 6px;
    border: 1px solid #444;
    background: #1c1c1c;
    color: #eee;
    resize: vertical;
  }
  button {
    margin-top: 0.5rem;
    font-size: 1rem;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    border: none;
    background: #3a7;
    color: #111;
    font-weight: 600;
  }
  button:disabled { background: #555; color: #999; }
  #result { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
  #result.ok { color: #6c6; }
  #result.err { color: #e66; }
  hr { border: none; border-top: 1px solid #333; margin: 2rem 0 1.5rem; }
  #log { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .msg { font-size: 0.95rem; }
  .msg .who { font-weight: 600; }
  .msg .meta { color: #888; font-size: 0.8rem; }
</style>
</head>
<body>
  <h1>robotd</h1>
  <div id="stateLog"></div>

  <hr>

  <h1>say</h1>
  <textarea id="text" rows="3" placeholder="Say something..."></textarea>
  <br>
  <button id="say">Say it</button>
  <div id="result"></div>

  <hr>

  <h1>chat</h1>
  <div id="log"></div>
  <textarea id="chatText" rows="2" placeholder="Ask the robot to do something..."></textarea>
  <br>
  <button id="send">Send</button>

  <script>
    const stateLog = document.getElementById("stateLog");

    async function pollState() {
      try {
        const res = await fetch("/state");
        const body = await res.json();
        if (!body.ok) return;
        stateLog.innerHTML = body.turns.length
          ? body.turns
              .map((t) => `<div class="msg"><span class="who">heard:</span> ${t.heard}<div class="meta">said: ${t.spoken}</div></div>`)
              .join("")
          : `<div class="msg meta">Nothing heard yet — hold the button and speak.</div>`;
      } catch (err) {
        // A missed poll isn't worth surfacing; the next one will catch up.
      }
    }
    pollState();
    setInterval(pollState, 3000);

    const text = document.getElementById("text");
    const say = document.getElementById("say");
    const result = document.getElementById("result");

    say.addEventListener("click", async () => {
      const value = text.value;
      say.disabled = true;
      result.className = "";
      result.textContent = "...";
      try {
        const res = await fetch("/say", {
          method: "POST",
          body: JSON.stringify({ text: value }),
        });
        const body = await res.json();
        result.className = body.ok ? "ok" : "err";
        result.textContent = body.detail;
      } catch (err) {
        result.className = "err";
        result.textContent = String(err);
      } finally {
        say.disabled = false;
      }
    });

    const chatText = document.getElementById("chatText");
    const send = document.getElementById("send");
    const log = document.getElementById("log");

    function addMessage(who, body) {
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `<span class="who">${who}:</span> ${body}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    send.addEventListener("click", async () => {
      const value = chatText.value;
      if (!value.trim()) return;
      send.disabled = true;
      addMessage("you", value);
      chatText.value = "";
      const thinking = addMessage("robot", "...");
      try {
        const res = await fetch("/chat", {
          method: "POST",
          body: JSON.stringify({ text: value }),
        });
        const body = await res.json();
        if (!body.ok) {
          thinking.innerHTML = `<span class="who">robot:</span> ${body.detail}`;
        } else {
          const calls = body.calls.map((c) => c.name).join(", ") || "none";
          const meta = [`calls: ${calls}`, `confidence: ${body.confidence}`, body.reasoning];
          if (body.error) meta.push(`error: ${body.error}`);
          if (body.suppressed_calls && body.suppressed_calls.length) {
            meta.push(`suppressed: ${body.suppressed_calls.map((c) => c.name).join(", ")}`);
          }
          if (body.ungrounded) meta.push("ungrounded");
          thinking.innerHTML =
            `<span class="who">robot:</span> ${body.text}` +
            `<div class="meta">${meta.join(" — ")}</div>`;
        }
      } catch (err) {
        thinking.innerHTML = `<span class="who">robot:</span> ${String(err)}`;
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
