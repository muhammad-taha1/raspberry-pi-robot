<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>robotd</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #111;
    color: #eee;
  }
  h1 { font-size: 1.2rem; font-weight: 600; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 1rem;
    padding: 0.5rem;
    border-radius: 6px;
    border: 1px solid #444;
    background: #1c1c1c;
    color: #eee;
    resize: vertical;
  }
  button {
    margin-top: 0.5rem;
    font-size: 1rem;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    border: none;
    background: #3a7;
    color: #111;
    font-weight: 600;
  }
  button:disabled { background: #555; color: #999; }
  #result { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
  #result.ok { color: #6c6; }
  #result.err { color: #e66; }
</style>
</head>
<body>
  <h1>robotd</h1>
  <textarea id="text" rows="3" placeholder="Say something..."></textarea>
  <br>
  <button id="say">Say it</button>
  <div id="result"></div>

  <script>
    const text = document.getElementById("text");
    const say = document.getElementById("say");
    const result = document.getElementById("result");

    say.addEventListener("click", async () => {
      const value = text.value;
      say.disabled = true;
      result.className = "";
      result.textContent = "...";
      try {
        const res = await fetch("/say", {
          method: "POST",
          body: JSON.stringify({ text: value }),
        });
        const body = await res.json();
        result.className = body.ok ? "ok" : "err";
        result.textContent = body.detail;
      } catch (err) {
        result.className = "err";
        result.textContent = String(err);
      } finally {
        say.disabled = false;
      }
    });
  </script>
</body>
</html>
