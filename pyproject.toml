[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotd"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["robotd*"]

[tool.setuptools.package-data]
robotd = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
